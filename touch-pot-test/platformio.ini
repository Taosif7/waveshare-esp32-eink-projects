; Live touch + potentiometer bring-up on the ESP32-C3 Super Mini and SH1106 OLED.
[env:esp32-c3-mini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
board_build.flash_mode = qio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
lib_deps =
  olikraus/U8g2 @ ^2.35.31
lib_ldf_mode = deep
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=1
  -DOLED_SH1106
  ; Touch SIG idle/active: most 3-pin touch modules go high when touched.
  ; If every circle is filled at rest, set this to 0 and rebuild.
  -DTOUCH_ACTIVE_HIGH=1
