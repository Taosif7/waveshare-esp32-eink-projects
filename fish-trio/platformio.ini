; Top-down koi pond. Right e-ink on the ESP32-C6, middle OLED and left IPS on one ESP32-C3.
; esp32c6: Waveshare ESP32-C6-ePaper-1.54
; esp32c3: ESP32-C3 Super Mini
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=1
  -Iinclude
  ; Arduino-ESP32 3.2's WiFi.h includes Network.h, and PlatformIO does not
  ; always put that library on the WiFi build line (the C6 deep+ scan misses it).
  -I${sysenv.HOME}/.platformio/packages/framework-arduinoespressif32/libraries/Network/src

[env:esp32c6]
board = esp32-c6-devkitc-1
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
lib_extra_dirs = ../dino-game/lib
lib_ldf_mode = deep+
build_src_filter = +<*> -<c3_main.cpp>
build_flags =
  ${env.build_flags}
  -DBOARD_EINK=1

[env:esp32c3]
board = esp32-c3-devkitm-1
board_build.flash_mode = qio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
lib_deps =
  olikraus/U8g2 @ 2.36.18
  adafruit/Adafruit GFX Library @ 1.11.11
  adafruit/Adafruit BusIO @ 1.16.2
  adafruit/Adafruit ST7735 and ST7789 Library @ 1.11.0
lib_ldf_mode = deep
build_src_filter = +<*> -<c6_main.cpp>
build_flags =
  ${env.build_flags}
  -DBOARD_C3=1
  -DOLED_SH1106
