; Diwali cracker — ESP32-C3 Super Mini + 57× WS2812
; Wi-Fi SSID/password come from the workspace-root .env via scripts/load_env.py
[env:esp32-c3-mini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
board_build.flash_mode = qio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
; Default dual-OTA slots are ~1.25 MB; boom MP3s need a larger single app slot.
board_build.partitions = huge_app.csv
extra_scripts =
  pre:scripts/load_env.py
  pre:scripts/embed_assets.py
lib_deps =
  fastled/FastLED @ ^3.9.14
  ESP32Async/AsyncTCP @ ^3.3.2
  ESP32Async/ESPAsyncWebServer @ ^3.6.0
lib_ldf_mode = deep
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=1
