; Waveshare ESP32-C6-ePaper-1.54 — UPI QR form over Wi-Fi → e-paper
[env:esp32-c6-epaper]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
; Auto-detect serial (macOS: /dev/cu.usbmodem*; Linux: /dev/ttyACM0)
board_build.flash_mode = qio

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
extra_scripts = pre:../tools/load_wifi_env.py
; QRCode comes from lib/QRCode (stack-safe fork of ricmoo/QRCode).
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=1
lib_ldf_mode = deep

